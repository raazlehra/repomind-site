name: Request Beta Access
description: Request access to the RepoMind private beta.
title: "[Beta Access] "
labels: ["beta-access"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in RepoMind. Do not post proprietary source code, credentials, API keys, tokens, customer data, or other sensitive repository information in this public issue.
  - type: input
    id: github_username
    attributes:
      label: GitHub username
      placeholder: "@your-handle"
    validations:
      required: true
  - type: dropdown
    id: operating_system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: "Example: Python 3.11"
    validations:
      required: true
  - type: textarea
    id: languages_frameworks
    attributes:
      label: Languages / frameworks
      description: "Examples: Python/FastAPI, TypeScript/React, Kotlin/Android, mixed repository."
    validations:
      required: true
  - type: dropdown
    id: repository_size
    attributes:
      label: Approximate repository size
      options:
        - under 100 files
        - 100-500 files
        - 500-2,000 files
        - 2,000+ files
        - not sure
    validations:
      required: true
  - type: checkboxes
    id: ai_coding_workflow
    attributes:
      label: AI coding workflow
      description: Select any tools you use. This does not imply RepoMind partnerships or endorsements.
      options:
        - label: Codex
        - label: GitHub Copilot
        - label: Claude
        - label: Cursor
        - label: Other
  - type: textarea
    id: test_interest
    attributes:
      label: What would you like to test?
      description: "Examples: retrieval quality, automatic freshness, explain mode, memory usefulness, MCP integration, large repository behavior, installation/setup."
    validations:
      required: true
  - type: textarea
    id: interest_reason
    attributes:
      label: Why are you interested in RepoMind?
    validations:
      required: true
  - type: checkboxes
    id: beta_acknowledgement
    attributes:
      label: Beta software acknowledgement
      options:
        - label: I understand RepoMind is pre-release beta software and may contain bugs.
          required: true
  - type: checkboxes
    id: privacy_acknowledgement
    attributes:
      label: Privacy acknowledgement
      options:
        - label: I will not post proprietary source code, credentials, API keys, tokens, customer data, or other sensitive repository information in public issues.
          required: true
  - type: checkboxes
    id: ownership_acknowledgement
    attributes:
      label: Repository ownership/control acknowledgement
      options:
        - label: I will test RepoMind only on repositories I own or am authorized to use.
          required: true
