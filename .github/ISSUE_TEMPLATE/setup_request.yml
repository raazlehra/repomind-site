name: Request Setup
description: Request founding-beta setup help for RepoMind.
title: "[Setup Request] "
labels: ["setup-request"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach private source code, credentials, API keys, tokens, or sensitive repository details to this public issue. Do not include payment details.
  - type: input
    id: github_username_name
    attributes:
      label: GitHub username/name
      placeholder: "@your-handle or name"
    validations:
      required: true
  - type: dropdown
    id: operating_system
    attributes:
      label: OS
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: "Example: Python 3.11"
    validations:
      required: true
  - type: textarea
    id: languages_frameworks
    attributes:
      label: Languages/frameworks
    validations:
      required: true
  - type: dropdown
    id: repository_size
    attributes:
      label: Approximate repository size
      options:
        - under 100 files
        - 100-500 files
        - 500-2,000 files
        - 2,000+ files
        - not sure
    validations:
      required: true
  - type: checkboxes
    id: ai_coding_workflow
    attributes:
      label: Coding-agent workflow
      options:
        - label: Codex
        - label: GitHub Copilot
        - label: Claude
        - label: Cursor
        - label: Other
  - type: textarea
    id: setup_help
    attributes:
      label: What do you need help setting up?
      description: Installation, repository initialization/configuration, health verification, MCP integration, freshness verification, context/memory smoke test, or usage guidance.
    validations:
      required: true
  - type: textarea
    id: preferred_scope
    attributes:
      label: Preferred scope
      description: Briefly describe the setup scope you want reviewed after request approval.
    validations:
      required: true
  - type: checkboxes
    id: privacy_acknowledgement
    attributes:
      label: Privacy acknowledgement
      options:
        - label: I will not post private source code, credentials, API keys, tokens, payment details, or sensitive repository information in this public issue.
          required: true
